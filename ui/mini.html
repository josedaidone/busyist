<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>buZyist timer</title>
<link rel="stylesheet" href="fonts/fonts.css">
<link rel="stylesheet" href="style.css">
<style>
  body { background: var(--bg); }
  .mini {
    position: absolute; inset: 0; display: flex; align-items: center; gap: 14px;
    padding: 0 16px 0 14px; border: 2px solid var(--line); cursor: grab; background: var(--bg);
  }
  .mini:active { cursor: grabbing; }
  .mini.alert { animation: pause-alert .6s steps(1, end) 6; }
  @keyframes pause-alert { 0% { background: var(--bz-tomate); border-color: var(--bz-tomate); color: #fff; } 50% { background: var(--bg); } }
  .m-ring { position: relative; width: 76px; height: 76px; flex: none; }
  .m-ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
  .m-ring circle { fill: none; stroke-width: 7; }
  .m-ring .track { stroke: var(--track); }
  body[data-phase="idle"] .m-ring .progress { opacity: 0; }
  .m-ring .progress { stroke: var(--phase); stroke-linecap: round; transition: stroke-dashoffset .9s linear, stroke .3s; }
  .m-time {
    position: absolute; inset: 0; display: grid; place-items: center;
    font: 600 19px/1 var(--bz-font-display); font-variant-numeric: tabular-nums;
  }
  body[data-phase="paused"] .m-time { animation: blink 1.6s ease-in-out infinite; }
  .m-body { flex: 1; min-width: 0; }
  .m-phase { display: flex; align-items: center; gap: 7px; font-size: 12px; font-weight: 700; color: var(--muted); }
  .m-phase .chip-s {
    display: inline-flex; align-items: center; height: 22px; padding: 0 9px; border-radius: 999px;
    background: var(--phase); color: var(--on-phase);
  }
  body[data-phase="idle"] .m-phase .chip-s { background: var(--surface); color: var(--muted); }
  .m-task {
    font-size: 14.5px; font-weight: 700; line-height: 1.25; margin-top: 4px;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
  .m-project { font-size: 12px; font-weight: 600; color: var(--muted); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .m-actions {
    position: absolute; top: 6px; right: 6px; display: flex; gap: 2px; opacity: 0;
    transition: opacity .15s; background: var(--surface); border-radius: 999px; padding: 3px;
  }
  .mini:hover .m-actions { opacity: 1; }
  .m-actions button {
    width: 28px; height: 28px; border: 0; border-radius: 50%; background: transparent;
    color: var(--muted); display: grid; place-items: center; cursor: pointer;
  }
  .m-actions button:hover { background: var(--line); color: var(--ink); }
  .m-actions svg { width: 15px; height: 15px; }
</style>
</head>
<body data-phase="idle">
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-play" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M8 5.5v13l10.5-6.5L8 5.5z"/></symbol>
  <symbol id="i-pause" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M8.5 5.5v13M15.5 5.5v13"/></symbol>
  <symbol id="i-stop" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linejoin="round"><rect x="6" y="6" width="12" height="12" rx="2.5"/></symbol>
  <symbol id="i-open" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M14 4h6v6M20 4l-8 8M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></symbol>
  <symbol id="i-x" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></symbol>
</svg>
<div class="mini pywebview-drag-region" id="mini" title="Drag to move · double-click to open buZyist">
  <div class="m-ring">
    <svg viewBox="0 0 80 80">
      <circle class="track" cx="40" cy="40" r="33"/>
      <circle class="progress" id="mProgress" cx="40" cy="40" r="33"/>
    </svg>
    <div class="m-time" id="mTime">--:--</div>
  </div>
  <div class="m-body">
    <div class="m-phase"><span class="chip-s" id="mPhase">Focus</span><span class="sep" id="mRound"></span></div>
    <div class="m-task" id="mTask">No task</div>
    <div class="m-project" id="mProject"></div>
  </div>
  <div class="m-actions">
    <button id="mPause" title="Pause"><svg><use id="mPauseIcon" href="#i-pause"/></svg></button>
    <button id="mStop" title="Stop"><svg><use href="#i-stop"/></svg></button>
    <button id="mOpen" title="Open buZyist"><svg><use href="#i-open"/></svg></button>
    <button id="mHide" title="Hide mini timer"><svg><use href="#i-x"/></svg></button>
  </div>
</div>
<script src="mini.js"></script>
</body>
</html>
