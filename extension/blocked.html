<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Back to work</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      font: 15px/1.5 -apple-system, "Segoe UI", system-ui, sans-serif;
      background: #16151a; color: #f2f1ee;
    }
    .card { text-align: center; padding: 40px; max-width: 560px; }
    .eyebrow { text-transform: uppercase; letter-spacing: .12em; font-size: 12px; color: #db4035; font-weight: 700; }
    h1 { font-size: 30px; margin: 14px 0 6px; }
    .task { font-size: 18px; color: #c9c7c2; margin: 0 0 24px; }
    .count { font-size: 15px; color: #9a988f; }
    .count b { color: #f2f1ee; }
    .url { margin-top: 26px; font-size: 12.5px; color: #6f6d66; word-break: break-all; }
    .hidden { display: none; }
    .pass { margin-top: 22px; background: none; border: 1px solid #3a3942; color: #c9c7c2; font: inherit; font-size: 13.5px; padding: 8px 16px; border-radius: 8px; cursor: pointer; }
    .pass:hover { border-color: #6f6d66; color: #f2f1ee; }
    .pass:disabled { opacity: .5; cursor: default; }
    .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #db4035; margin-right: 7px; vertical-align: middle; }
  </style>
</head>
<body>
  <div class="card">
    <div class="eyebrow" id="eyebrow"><span class="dot"></span>Busyist focus</div>
    <h1 id="title">Back to work.</h1>
    <p class="task" id="task"></p>
    <p class="count" id="count">Checking focus&hellip;</p>
    <button class="pass hidden" id="pass" type="button"></button>
    <p class="url" id="url"></p>
  </div>
  <script src="blocked.js"></script>
</body>
</html>
