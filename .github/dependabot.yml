version: 2
updates:
  # Keeps the SHA-pinned actions in .github/workflows current (it updates the
  # "# vX.Y.Z" comment along with the SHA).
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  # Python requirements (runtime, build and dev).
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
