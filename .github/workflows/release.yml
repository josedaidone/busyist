name: Build and release

# Push a tag like v1.0.1 to build and publish a release.
# "Run workflow" on the Actions tab builds without publishing.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write  # to create the release

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check the tag matches the app version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $version = (Select-String -Path busyist.py -Pattern '__version__ = "([\d.]+)"').Matches[0].Groups[1].Value
          if ("v$version" -ne "${{ github.ref_name }}") { throw "Tag ${{ github.ref_name }} but busyist.py says $version" }

      - name: Install Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }

      - name: Build
        shell: pwsh
        env:
          BUILD_PYTHON: python
        run: ./build.ps1

      # Signs SHA256SUMS.txt for the in-app updater (#022, docs/RELEASING.md).
      # Without the secret it only warns, unless busyist.py already lists
      # UPDATE_PUBKEYS (installed copies would refuse an unsigned release).
      - name: Sign the checksums
        shell: pwsh
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
          MINISIGN_PASSWORD: ${{ secrets.MINISIGN_PASSWORD }}
        run: |
          python tools/minisign.py sign -m dist/SHA256SUMS.txt --app busyist.py --optional
          if ($LASTEXITCODE -ne 0) { throw "Signing SHA256SUMS.txt failed" }

      - uses: actions/upload-artifact@v4
        with:
          name: buzyist-build
          path: |
            dist/*.exe
            dist/*.zip
            dist/SHA256SUMS.txt
            dist/SHA256SUMS.txt.minisig

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.exe
            dist/*.zip
            dist/SHA256SUMS.txt
            dist/SHA256SUMS.txt.minisig
          generate_release_notes: true
