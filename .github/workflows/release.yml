name: Build and release

# Releases come from __version__ in busyist.py:
# - a push to main (a merged PR) whose version has no vX.Y.Z tag yet tests,
#   builds, tags that commit and publishes it; any other push to main stops
#   after the cheap "version" job, so a PR publishes only when it bumps the
#   version;
# - pushing a tag like v1.0.1 by hand still builds and publishes that tag;
# - "Run workflow" on the Actions tab builds without publishing.
#
# What this publishes is what the in-app updater installs silently, so:
# - every action is pinned by commit SHA (Dependabot keeps them current);
# - no job gets a token by default (permissions: {} below), each one asks for
#   what it needs;
# - the job that runs repo code (build.ps1, pip, Inno Setup) only reads; the
#   job that can write (publish) runs no repo code, it only uploads the files
#   the build job produced.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions: {}

# Two merges in a row release one after the other, never at the same time.
concurrency:
  group: release
  cancel-in-progress: false

env:
  # Inno Setup is installed from the official release and checked against this
  # hash (the digest GitHub lists for the asset). Change both together.
  INNO_VERSION: "6.7.3"
  INNO_URL: https://github.com/jrsoftware/issrc/releases/download/is-6_7_3/innosetup-6.7.3.exe
  INNO_SHA256: 9c73c3bae7ed48d44112a0f48e66742c00090bdb5bef71d9d3c056c66e97b732

jobs:
  # Decides what this run does. Outputs: tag (vX.Y.Z), build and release
  # ("true"/"false"). A push to main releases only a version that has no tag
  # yet and is newer than every existing v* tag.
  version:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.decide.outputs.tag }}
      build: ${{ steps.decide.outputs.build }}
      release: ${{ steps.decide.outputs.release }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version=$(sed -nE 's/^__version__ = "([0-9]+\.[0-9]+\.[0-9]+)"$/\1/p' busyist.py)
          [ -n "$version" ] || { echo "::error::no __version__ = \"x.y.z\" line in busyist.py"; exit 1; }
          tag="v$version"
          build=true release=false
          if [ "$EVENT" = push ] && [[ "$REF" == refs/tags/v* ]]; then
            tag="$REF_NAME"   # the build job checks it matches __version__
            release=true
          elif [ "$EVENT" = push ]; then   # main
            tags=$(gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/v" --paginate --jq '.[].ref | ltrimstr("refs/tags/")')
            if grep -qxF "$tag" <<<"$tags"; then
              echo "$tag is already released; nothing to publish."
              build=false
            else
              newest=$(grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' <<<"$tags" | sort -V | tail -n1 || true)
              if [ -n "$newest" ] && [ "$(printf '%s\n' "$newest" "$tag" | sort -V | tail -n1)" != "$tag" ]; then
                echo "::error::busyist.py says $version, older than the latest release $newest"
                exit 1
              fi
              echo "Releasing $tag (latest so far: ${newest:-none})."
              release=true
            fi
          fi
          { echo "tag=$tag"; echo "build=$build"; echo "release=$release"; } >> "$GITHUB_OUTPUT"

  # Lint and tests first (ci.yml): a version with a failing test never publishes.
  test:
    needs: version
    if: needs.version.outputs.build == 'true'
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  build:
    needs: [version, test]
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: read
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Check the tag matches the app version
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          TAG: ${{ github.ref_name }}
        run: |
          $version = (Select-String -Path busyist.py -Pattern '__version__ = "([\d.]+)"').Matches[0].Groups[1].Value
          if ("v$version" -ne $env:TAG) { throw "Tag $env:TAG but busyist.py says $version" }

      - name: Install Inno Setup ${{ env.INNO_VERSION }}
        run: |
          $setup = Join-Path $env:RUNNER_TEMP "innosetup-$env:INNO_VERSION.exe"
          $ProgressPreference = "SilentlyContinue"
          Invoke-WebRequest $env:INNO_URL -OutFile $setup -UseBasicParsing
          $hash = (Get-FileHash $setup -Algorithm SHA256).Hash.ToLower()
          if ($hash -ne $env:INNO_SHA256) { throw "Inno Setup installer hash $hash, expected $env:INNO_SHA256" }
          $dir = Join-Path $env:RUNNER_TEMP "InnoSetup"
          $p = Start-Process $setup -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/SP-", "/DIR=`"$dir`"" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Inno Setup install failed ($($p.ExitCode))" }
          if (-not (Test-Path "$dir\ISCC.exe")) { throw "ISCC.exe not found in $dir" }
          # First on PATH, so build.ps1 uses this one over any copy on the runner.
          $dir | Out-File $env:GITHUB_PATH -Append -Encoding utf8

      - name: Build
        env:
          BUILD_PYTHON: python
        run: ./build.ps1

      # Signs SHA256SUMS.txt for the in-app updater (#022, docs/RELEASING.md).
      # Without the secret it only warns, unless busyist.py already lists
      # UPDATE_PUBKEYS (installed copies would refuse an unsigned release).
      - name: Sign the checksums
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
          MINISIGN_PASSWORD: ${{ secrets.MINISIGN_PASSWORD }}
        run: |
          python tools/minisign.py sign -m dist/SHA256SUMS.txt --app busyist.py --optional
          if ($LASTEXITCODE -ne 0) { throw "Signing SHA256SUMS.txt failed" }

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: buzyist-build
          if-no-files-found: error
          path: |
            dist/*.exe
            dist/*.zip
            dist/SHA256SUMS.txt
            dist/SHA256SUMS.txt.minisig

  # Only uploads what the build job produced: no checkout, no repo code.
  # On a push to main it also creates the tag, on the commit that was built.
  publish:
    needs: [version, build]
    if: needs.version.outputs.release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write  # to create the release
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: buzyist-build
          path: dist

      - name: Check the files against SHA256SUMS.txt
        working-directory: dist
        run: |
          ls -l
          sha256sum --check --strict SHA256SUMS.txt
          ls Buzyist-Setup-*.exe Busyist-Setup-*.exe Buzyist-*-portable.zip

      - name: Publish the release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          files: |
            dist/*.exe
            dist/*.zip
            dist/SHA256SUMS.txt
            dist/SHA256SUMS.txt.minisig
          generate_release_notes: true
